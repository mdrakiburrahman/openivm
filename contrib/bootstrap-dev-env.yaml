version: '3'

vars:
  DISTRO: Ubuntu-24.04
  REPO: /workspaces/openivm

tasks:
  default:
    desc: Recreate WSL, clone this checkout's branch and commit into it, then run the up task
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -NonInteractive -File bootstrap-dev-env.ps1 -Distro {{.DISTRO}} -RepoPath {{.REPO}}
      - task: up

  up:
    desc: Install the build toolchain and initialize missing pinned submodules in the existing WSL clone
    platforms: [windows]
    cmds:
      - wsl -d {{.DISTRO}} --cd {{.REPO}} --exec ./contrib/bootstrap-dev-env.sh
